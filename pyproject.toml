[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-under-interdependence"
version = "0.1.0"
description = "Research code for fixed-institution and online planner experiments under resource interdependence."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<0.14",
  "scipy>=1.16,<2",
]

[tool.setuptools]
packages = []
